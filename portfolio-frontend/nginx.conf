server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 ipv6=off;

  # Bundles JS/CSS hashés par Create React App (main.<hash>.js, etc.) --
  # le nom de fichier change à chaque contenu différent, donc aucun risque
  # à les cacher longtemps et de façon "immutable".
  location /static/ {
    root   /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 2026-08-19 : index.html n'avait AUCUN en-tête de cache -- chaque
  # navigateur décidait lui-même combien de temps le garder (souvent des
  # heures en cache heuristique faute de Cache-Control explicite). Un
  # utilisateur pouvait rester bloqué sur une ancienne version de l'app
  # après un déploiement sans même s'en rendre compte -- confirmé en
  # direct (filtre sandbox du Live Paper Trading invisible malgré un
  # déploiement vérifié correct côté serveur). index.html référence les
  # bundles par leur hash -- il DOIT toujours être revalidé pour que le
  # navigateur découvre le nouveau hash après un déploiement, même si les
  # bundles eux-mêmes restent cachés longtemps.
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /api/ask-the-quant-stream/ {
    proxy_pass http://backend:8000/api/ask-the-quant-stream/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Accel-Buffering no;
  }

  # Analyse manuelle à la demande (2026-08-13) : DeepSeek + Claude en
  # séquence, confirmé ~70-90s en conditions réelles -- au-dessus du
  # proxy_read_timeout par défaut de /api/ (120s marginal, mais surtout
  # le timeout axios côté frontend était fixé à 30s par défaut, jamais
  # ajusté pour cet endpoint précis : nginx aurait fini par couper la
  # connexion en 504 même une fois le frontend corrigé). Bloc dédié
  # (comme /api/ask-the-quant-stream/ juste au-dessus) plutôt que de
  # relever le timeout général de /api/ pour tout le monde.
  location ~ ^/api/analysis/ticker/[^/]+/manual-check/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }
}
