services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-personalstock}
      POSTGRES_USER: ${DB_USER:-personalstock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personalstock}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./portfolio_backend
      dockerfile: Dockerfile
    env_file:
      - ./deploy/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_db:/app/db
      - backend_models:/app/portfolio/ml_engine/models
      - ${BACKUP_SSD_PATH:-/mnt/BackupSSD}:/mnt/BackupSSD
    ports:
      - "8001:8000"
    restart: unless-stopped

  celery_worker:
    build:
      context: ./portfolio_backend
      dockerfile: Dockerfile
    command: celery -A portfolio_backend worker --loglevel=INFO --pool=solo
    env_file:
      - ./deploy/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_db:/app/db
      - backend_models:/app/portfolio/ml_engine/models
      - ${BACKUP_SSD_PATH:-/mnt/BackupSSD}:/mnt/BackupSSD
    restart: unless-stopped

  # Worker dédié à la queue analysis_queue (voir CELERY_TASK_ROUTES dans
  # settings.py). Additif : ne remplace pas celery_worker, qui continue de
  # consommer la queue par défaut ('celery') sans aucun changement. But :
  # que le scan fondamental (run_daily_scan, basse fréquence) ne dépende
  # plus jamais du rythme du worker principal --pool=solo, saturé par les
  # tâches haute-fréquence (penny_sniper_alert, monitor_hive_trade, etc.).
  celery_worker_analysis:
    build:
      context: ./portfolio_backend
      dockerfile: Dockerfile
    command: celery -A portfolio_backend worker -Q analysis_queue --loglevel=INFO --pool=solo --concurrency=1 -n analysis@%h
    env_file:
      - ./deploy/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_db:/app/db
      - backend_models:/app/portfolio/ml_engine/models
      - ${BACKUP_SSD_PATH:-/mnt/BackupSSD}:/mnt/BackupSSD
    restart: unless-stopped

  celery_beat:
    build:
      context: ./portfolio_backend
      dockerfile: Dockerfile
    # --schedule (2026-08-12) : le fichier d'état "dernière exécution" de
    # Beat vit par défaut dans le CWD du process (/app/celerybeat-schedule.db,
    # jamais monté) -- écrasé à chaque --force-recreate, donc Beat "oubliait"
    # avoir déjà tourné aujourd'hui et re-déclenchait des tâches planifiées à
    # un horaire fixe hors de leur fenêtre -- cause racine confirmée de
    # l'item 7/TECH_DEBT_NOTES.md : 3 exécutions hors-calendrier de
    # run_daily_scan la nuit du 2026-08-11/12 (aucune position dupliquée
    # grâce au garde-fou existant, mais du budget Claude gaspillé pour rien).
    # Une variable d'env CELERYBEAT_SCHEDULE existait déjà ici mais n'était
    # lue par AUCUN code du projet (pas une variable standard Celery) --
    # remplacée par le vrai flag CLI, seul mécanisme qui fonctionne
    # réellement, vérifié en direct sur le NAS avant ce commit.
    command: celery -A portfolio_backend beat --loglevel=INFO --schedule=/celerybeat/celerybeat-schedule
    env_file:
      - ./deploy/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_db:/app/db
      - backend_models:/app/portfolio/ml_engine/models
      - ${BACKUP_SSD_PATH:-/mnt/BackupSSD}:/mnt/BackupSSD
      - celerybeat_schedule:/celerybeat
    restart: unless-stopped

  realtime_tracker:
    build:
      context: ./portfolio_backend
      dockerfile: Dockerfile
    command: python manage.py realtime_tracker
    env_file:
      - ./deploy/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./portfolio-frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3001:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:
  backend_db:
  backend_models:
  celerybeat_schedule:
